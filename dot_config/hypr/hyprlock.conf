# Palette variables ($base, $blue, ..., $panel_rim), $wallpaper and $accent (the greeting's colour)
# of the active light/dark scheme; see ~/.local/bin/colorscheme
source = ~/.local/state/colorscheme/current/hyprlock.conf

# LAYOUT
# The widgets form a column on the left: their left edges are at $col_x, and the user and
# password boxes are $col_w by $box_h. ({{a + b}} is hyprlang arithmetic: one operation each.)
# In Iosevka Term Extended a character is 0.8 * font_size wide and a line 1.67 * font_size tall.
$col_x = 170
$box_h = 55
$greet_y = 125
$greet_size = 55
$date_size = 20
$user_y = -140
$user_size = 16
$password_y = -220
# wide enough for the longest date, "Wednesday, September 30": 23 characters of 0.8 * font_size
$col_w = {{date_size * 18.4}}
# the user label centred in its box: 7 characters (icon, two spaces, "alex") of 0.8 * font_size
$col_mid = {{col_w / 2}}
$col_centre = {{col_x + col_mid}}
$user_half = {{user_size * 2.8}}
$user_x = {{col_centre - user_half}}
# The glass card behind the column reaches $pad beyond it on every side
$pad = 30
$pad2 = {{pad * 2}}
$card_x = {{col_x - pad}}
$card_w = {{col_w + pad2}}
# the greeting's top: its centre plus half its line height
$greet_half = {{greet_size * 0.835}}
$greet_top = {{greet_y + greet_half}}
$card_top = {{greet_top + pad}}
$half_box = {{box_h / 2}}
$password_bottom = {{password_y - half_box}}
$card_bottom = {{password_bottom - pad}}
$card_h = {{card_top - card_bottom}}
$card_sum = {{card_top + card_bottom}}
$card_y = {{card_sum / 2}}
$card_rounding = 8
# how far the wallpaper behind the card is blurred (Gaussian radius in pixels)
$card_blur = 24
# The card's tint is $base at $card_opacity or more: as much as the wallpaper behind it needs for
# $dim_text, the dimmest small text on the card, to reach $card_contrast : 1
$card_opacity = 0.69
$card_contrast = 4.5
$dim_text = $subtext1

# BACKGROUND
background {
    monitor =
    # this mode's wallpaper (from .chezmoidata/colorscheme.toml); the base colour if it's missing
    path = $wallpaper
    color = $base
    #blur_passes = 0
    #contrast = 0.8916
    #brightness = 0.8172
    #vibrancy = 0.1696
    #vibrancy_darkness = 0.0
    # under the card's blurred image (hyprlock draws images after shapes unless told otherwise)
    zindex = -2
}

# CARD
# Frosted glass, so the text reads on any wallpaper: the wallpaper behind the card, blurred and
# tinted with the scheme's base colour, inside a faint rim.
# hyprlock can only blur the whole background, so colorscheme renders the card with
# ~/.config/hypr/scripts/hyprlock_card.py, from the $card_* variables above.
image {
    monitor =
    path = ~/.local/state/colorscheme/current/hyprlock-card.png
    # an image's size is its shorter side: the card's width
    size = $card_w
    rounding = $card_rounding
    border_size = 0
    # hyprlock draws images after shapes; this puts it under the rim and the user box
    zindex = -1
    position = $card_x, $card_y
    halign = left
    valign = center
}

shape {
    monitor =
    size = $card_w, $card_h
    # just the rim: the tint is in the image
    color = rgba(00000000)
    rounding = $card_rounding
    border_size = 1
    border_color = $panel_rim
    position = $card_x, $card_y
    halign = left
    valign = center
}

# GREETINGS
label {
    monitor =
    text = Welcome!
    color = $accent
    font_size = $greet_size
    font_family = Iosevka Term Extended
    position = $col_x, $greet_y
    halign = left
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = $text
    font_size = 40
    font_family = Iosevka Term Extended
    position = $col_x, 50
    halign = left
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +'%A, %B %d')</span>"
    color = $dim_text
    font_size = $date_size
    text_align = center
    font_family = Iosevka Term Extended
    position = $col_x, 0
    halign = left
    valign = center
}

# Profie-Photo
image {
    monitor =
    path = ~/.config/hypr/pfp.webp
    border_size = 1
    border_color = $blue
    size = 160
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 249, 25
    halign = left
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = $col_w, $box_h
    color = $panel_fill
    rounding = -1
    border_size = 0
    border_color = rgba(0, 0, 0, 1)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = $col_x, $user_y
    halign = left
    valign = center
}

# USER
label {
    monitor =
    text =  $USER
    color = $text
    font_size = $user_size
    font_family = Iosevka Term Extended
    position = $user_x, $user_y
    halign = left
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = $col_w, $box_h
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $blue
    inner_color = $panel_fill
    font_color = $text
    check_color = $yellow
    fail_color = $red
    capslock_color = $peach
    fade_on_empty = false
    font_family = Iosevka Term Extended
    placeholder_text = <i>Password</i>
    hide_input = false
    position = $col_x, $password_y
    halign = left
    valign = center
}
