# Catppuccin flavour for each mode. The desktop switches between them at
# sunrise and sunset (dot_local/bin/executable_colorscheme-solar).
[colorscheme]
dark  = "mocha"
light = "latte"

# Each mode's wallpaper, relative to $HOME (the images aren't tracked), on the desktop and the
# lock screen. The accents are picked to match it (dot_local/bin/executable_colorscheme-accents).
[colorscheme.wallpaper]
dark  = "Pictures/wallpapers/anime-girl-train-station.png"
light = "Pictures/wallpapers/anime-girl-train-station.png"
