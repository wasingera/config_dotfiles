# Catppuccin {{ .name }} for dunst, loaded as the drop-in
# ~/.config/dunst/dunstrc.d/colors.conf (overrides dunstrc).
# Generated by chezmoi from .chezmoitemplates/colors/dunst.conf.

[global]
    # same accent as the bar
    frame_color = "{{ .blue }}"
    icon_theme = {{ if eq .name "latte" }}Papirus-Light{{ else }}Papirus-Dark{{ end }}

[urgency_low]
    background = "{{ .base }}"
    foreground = "{{ .subtext0 }}"
    frame_color = "{{ .overlay0 }}"
    highlight = "{{ .overlay0 }}"

[urgency_normal]
    background = "{{ .base }}"
    foreground = "{{ .text }}"
    highlight = "{{ .blue }}"

[urgency_critical]
    background = "{{ .base }}"
    foreground = "{{ .text }}"
    frame_color = "{{ .red }}"
    highlight = "{{ .red }}"
