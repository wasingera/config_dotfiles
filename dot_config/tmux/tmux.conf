# tmux config, the same on every machine.

# Prefix: Ctrl+a. Press it twice to send a Ctrl+a to the program in the pane.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Terminal: true colour, focus events (nvim's autoread and colour-mode watcher)
# and Escape without the default half-second wait.
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-kitty:RGB:extkeys,*256col*:RGB'
set -g extended-keys on
set -g focus-events on
set -sg escape-time 10
# Let kitty's graphics protocol through, for yazi's image previews
set -g allow-passthrough on
# Copying sends the text to the system clipboard over OSC 52, which works over SSH too
set -g set-clipboard on

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Splits and new windows start in the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux.conf"

# Copy mode: vi keys, v selects, y copies
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Status bar: the session in an accent pill (accent2 while the prefix is held),
# the windows (the current one in the accent), and the host on the right.
set -g status-position bottom
set -g status-left-length 40
set -g status-left "#[fg=#{@accent_fg},bg=#{?client_prefix,#{@accent2},#{@accent}},bold] #S #[default] "
set -g status-right "#[fg=#{@thm_subtext0}]#h "
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#{@thm_subtext0}] #I #W#{?window_zoomed_flag, (zoom),} "
setw -g window-status-current-format "#[fg=#{@accent},bold] #I #W#{?window_zoomed_flag, (zoom),} "

# Colours. The formats above use only these options. ANSI names are the
# fallback; on the desktop, the active Catppuccin scheme (see
# ~/.local/bin/colorscheme) overrides them, along with the styles below.
set -g @thm_subtext0 brightblack
set -g @accent blue
set -g @accent2 magenta
set -g @accent_fg black
set -g status-style "bg=default,fg=default"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=default"
set -g mode-style "bg=blue,fg=black"
source-file -q ~/.local/state/colorscheme/current/tmux.conf
