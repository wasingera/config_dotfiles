# Catppuccin {{ .name }} for GTK3 apps; this is ~/.config/gtk-3.0/settings.ini,
# via a symlink to the active light/dark scheme. colorscheme also copies the
# theme name into gsettings, which GTK3 on Wayland and the file dialog read.
# Generated by chezmoi from .chezmoitemplates/colors/gtk3.ini.
[Settings]
gtk-theme-name=catppuccin-{{ .name }}-blue-standard+default
gtk-application-prefer-dark-theme={{ if eq .name "latte" }}0{{ else }}1{{ end }}
