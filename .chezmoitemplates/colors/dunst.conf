# Catppuccin {{ .name }} for dunst, loaded as the drop-in
# ~/.config/dunst/dunstrc.d/colors.conf (overrides dunstrc).
# Generated by chezmoi from .chezmoitemplates/colors/dunst.conf.
#
# Backgrounds are translucent; Hyprland blurs what's behind them (the
# "notifications" layer rule in hyprland.lua).

[global]
    # faint rim around the glass
    frame_color = "{{ .text }}26"
    icon_theme = {{ if eq .name "latte" }}Papirus-Light{{ else }}Papirus-Dark{{ end }}

[urgency_low]
    background = "{{ .base }}b3"
    foreground = "{{ .subtext0 }}"
    highlight = "{{ .overlay1 }}"

[urgency_normal]
    background = "{{ .base }}bf"
    foreground = "{{ .text }}"
    highlight = "{{ .blue }}"

[urgency_critical]
    background = "{{ .base }}d9"
    foreground = "{{ .text }}"
    frame_color = "{{ .red }}"
    highlight = "{{ .red }}"
