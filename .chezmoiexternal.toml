# zsh and tmux plugins, pinned to a commit. To update one, swap the commit hash in its URL.
# exact = true removes files that aren't in the archive (e.g. old submodule .git files).

[".config/zsh/plugins/pure"]
    type = "archive"
    url = "https://github.com/sindresorhus/pure/archive/54bd501c802283dee0940457da6eb3e642bd1453.tar.gz"
    exact = true
    stripComponents = 1

[".config/zsh/plugins/zsh-autosuggestions"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-autosuggestions/archive/85919cd1ffa7d2d5412f6d3fe437ebdbeeec4fc5.tar.gz"
    exact = true
    stripComponents = 1

[".config/zsh/plugins/zsh-completions"]
