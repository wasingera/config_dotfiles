# tmux config, the same on every machine.

# Prefix: Ctrl+a. Press it twice to send a Ctrl+a to the program in the pane.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Terminal: true colour, focus events (nvim's autoread and colour-mode watcher)
# and Escape without the default half-second wait.
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-kitty:RGB:extkeys,*256col*:RGB'
set -g extended-keys on
set -g focus-events on
set -sg escape-time 10
# Let kitty's graphics protocol through, for yazi's image previews
set -g allow-passthrough on
# Copying sends the text to the system clipboard over OSC 52, which works over SSH too
set -g set-clipboard on

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Splits and new windows start in the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux.conf"
# Pick a session, or a directory from zoxide to open one in
bind f display-popup -E -w 60% -h 50% ~/.config/tmux/scripts/pick-session.sh

# Copy mode: vi keys, v selects, y copies
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Ctrl+h/j/k/l move between panes, Alt+h/j/k/l resize them. In a pane running
# nvim, smart-splits.nvim sets @pane-is-vim, so the keys go to nvim, which moves
# between its own splits and hands the move back to tmux at its edge. At the
# window's edge nothing happens (select-pane alone would wrap to the far side),
# except that Ctrl+l there goes to the program, so it still clears a shell.
bind -n C-h if -F "#{@pane-is-vim}" { send-keys C-h } { if -F "#{pane_at_left}" {} { select-pane -L } }
bind -n C-j if -F "#{@pane-is-vim}" { send-keys C-j } { if -F "#{pane_at_bottom}" {} { select-pane -D } }
bind -n C-k if -F "#{@pane-is-vim}" { send-keys C-k } { if -F "#{pane_at_top}" {} { select-pane -U } }
bind -n C-l if -F "#{@pane-is-vim}" { send-keys C-l } { if -F "#{pane_at_right}" { send-keys C-l } { select-pane -R } }
bind -n M-h if -F "#{@pane-is-vim}" { send-keys M-h } { resize-pane -L 3 }
bind -n M-j if -F "#{@pane-is-vim}" { send-keys M-j } { resize-pane -D 3 }
bind -n M-k if -F "#{@pane-is-vim}" { send-keys M-k } { resize-pane -U 3 }
bind -n M-l if -F "#{@pane-is-vim}" { send-keys M-l } { resize-pane -R 3 }
bind -T copy-mode-vi C-h if -F "#{pane_at_left}" {} { select-pane -L }
bind -T copy-mode-vi C-j if -F "#{pane_at_bottom}" {} { select-pane -D }
bind -T copy-mode-vi C-k if -F "#{pane_at_top}" {} { select-pane -U }
bind -T copy-mode-vi C-l if -F "#{pane_at_right}" {} { select-pane -R }
# That takes the shell's Ctrl+k (kill to the end of the line), and Ctrl+l
# (clear) beside another pane; the prefix followed by the key sends it through
bind C-h send-keys C-h
bind C-j send-keys C-j
bind C-k send-keys C-k
bind C-l send-keys C-l

# Status bar: the session in an accent pill (accent2 while the prefix is held),
# the windows (the current one in the accent), and the host on the right.
set -g status-position bottom
set -g status-left-length 40
set -g status-left "#[fg=#{@accent_fg},bg=#{?client_prefix,#{@accent2},#{@accent}},bold] #S #[default] "
set -g status-right "#[fg=#{@thm_subtext0}]#h "
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#{@thm_subtext0}] #I #W#{?window_zoomed_flag, (zoom),} "
setw -g window-status-current-format "#[fg=#{@accent},bold] #I #W#{?window_zoomed_flag, (zoom),} "

# Each pane has a header on its top border: the active one in an accent pill,
# like the session. The borders stay one colour; with two panes tmux would
# otherwise colour only the half of the shared border next to the active pane.
# A window with one pane has no header: the hook turns them on per window when
# its layout changes (a split, a pane closing).
setw -g pane-border-status off
set-hook -g window-layout-changed 'setw -F pane-border-status "#{?#{==:#{window_panes},1},off,top}"'
setw -g pane-border-indicators off
setw -g pane-border-format "#{?pane_active,#[fg=#{@accent_fg}#,bg=#{@accent}#,bold],#[fg=#{@thm_subtext0}]} #P #{pane_current_command} #[default]"

# Colours. The formats above use only these options. ANSI names are the
# fallback; on the desktop, the active Catppuccin scheme (see
# ~/.local/bin/colorscheme) overrides them, along with the styles below.
set -g @thm_subtext0 brightblack
set -g @accent blue
set -g @accent2 magenta
set -g @accent_fg black
set -g status-style "bg=default,fg=default"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=brightblack"
set -g message-style "bg=default,fg=default"
set -g mode-style "bg=blue,fg=black"
source-file -q ~/.local/state/colorscheme/current/tmux.conf

# Plugins, pinned in chezmoi's .chezmoiexternal.toml. They go last: continuum
# adds its autosave to status-right, so that has to be set already.
%hidden plugins=~/.config/tmux/plugins

# resurrect saves the sessions, windows, panes and their directories (prefix
# C-s, restore with prefix C-r); continuum saves every 15 minutes and restores
# the last save when the server starts
set -g @resurrect-capture-pane-contents on
set -g @continuum-restore on
set -g @continuum-save-interval 15
run-shell $plugins/tmux-resurrect/resurrect.tmux
# run-shell waits for everything holding its output open, including the restore
# continuum starts in the background. Without the redirect the restore would
# run before tmux makes the session being started, which then sits beside it.
run-shell "$plugins/tmux-continuum/continuum.tmux >/dev/null 2>&1"

# extrakto: prefix Tab picks a path, URL or word from the window with fzf. Tab
# inserts it at the prompt, Enter copies it (over OSC 52, like copy mode).
set -g @extrakto_clip_mode tmux_osc52
set -g @extrakto_popup_size "60%,50%"
# fzf in the colour scheme's colours, like the session picker
set -g @extrakto_fzf_tool ~/.config/tmux/scripts/fzf.sh
run-shell $plugins/extrakto/extrakto.tmux
