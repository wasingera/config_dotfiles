# Open images in imv. All selected files are passed, so h/l flips through them.
# orphan detaches imv so yazi stays usable while it's open.
[opener]
image = [{ run = 'imv %s', orphan = true, desc = "imv", for = "unix" }]

[open]
# HTML matches the default text/* rule, which opens $EDITOR. Send it to
# xdg-open (the browser) instead; edit stays available under O.
prepend_rules = [
	{ mime = "image/*", use = "image" },
	{ mime = "text/html", use = ["open", "edit", "reveal"] },
]

[preview]
# Big enough that previews fill the pane; the default 600x900 leaves a gap.
max_width = 2000
max_height = 2000

[plugin]
# Formats the built-in "image" previewer handles (avif/heic/jxl/svg go through
# magick or resvg first and keep their own previewers).
prepend_previewers = [
	{ mime = "image/{png,jpeg,gif,webp,bmp,tiff}", run = "center-image" },
]
