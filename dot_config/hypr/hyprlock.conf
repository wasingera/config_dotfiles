# BACKGROUND
background {
    monitor =
    #path = ~/.config/hypr/images/lockscreen.jpg
    path = ~/images/wallpapers/Cloudsday.png
    #blur_passes = 0
    #contrast = 0.8916
    #brightness = 0.8172
    #vibrancy = 0.1696
    #vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# GREETINGS
label {
    monitor =
    text = Welcome!
    color = rgb(203, 166, 247)
    font_size = 55
    font_family = Iosevka Term Extended
    position = 170, 125
    halign = left
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgb(243, 139, 168)
    font_size = 40
    font_family = Iosevka Term Extended
    position = 170, 50
    halign = left
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +'%A, %B %d')</span>"
    color = rgb(249, 226, 175)
    font_size = 20
    text_align = center
    font_family = Iosevka Term Extended
    position = 170, 0
    halign = left
    valign = center
}

# Profie-Photo
image {
    monitor =
    path = ~/.config/hypr/pfp.webp
    border_size = 1
    border_color = rgba(137, 180, 250, .75)
    size = 160
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 249, 25
    halign = left
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 320, 55
    color = rgba(24, 24, 37, 1.0)
    rounding = -1
    border_size = 0
    border_color = rgba(0, 0, 0, 1)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = 170, -140
    halign = left
    valign = center
}

# USER
label {
    monitor =
    text =  $USER
    color = rgb(166, 227, 161)
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 16
    font_family = Iosevka Term Extended
    position = 281, -140
    halign = left
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgb(127, 132, 156)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    font_family = Iosevka Term Extended
    placeholder_text = <i><span foreground="##ffffff99">Password</span></i>
    hide_input = false
    position = 170, -220
    halign = left
    valign = center
}
