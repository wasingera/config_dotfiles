# Catppuccin {{ .name }} for tmux, sourced by ~/.config/tmux/tmux.conf.
# Generated by chezmoi from .chezmoitemplates/colors/tmux.conf.
{{- range $name, $hex := . }}{{ if ne $name "name" }}
set -g @thm_{{ $name }} "{{ $hex }}"
{{- end }}{{ end }}
# the accent pair: accent for highlights, accent2 beside it; accent_fg is text on accent
set -g @accent "{{ .blue }}"
set -g @accent2 "{{ .mauve }}"
set -g @accent_fg "{{ .crust }}"

# Style options don't expand formats, so they take the colours directly
set -g status-style "bg={{ .mantle }},fg={{ .text }}"
set -g pane-border-style "fg={{ .surface1 }}"
set -g pane-active-border-style "fg={{ .surface1 }}"
set -g message-style "bg={{ .surface0 }},fg={{ .text }}"
set -g message-command-style "bg={{ .surface0 }},fg={{ .text }}"
set -g mode-style "bg={{ .blue }},fg={{ .crust }}"
set -g copy-mode-match-style "bg={{ .surface2 }},fg={{ .text }}"
set -g copy-mode-current-match-style "bg={{ .peach }},fg={{ .crust }}"
set -g popup-border-style "fg={{ .blue }}"
set -g display-panes-colour "{{ .overlay0 }}"
set -g display-panes-active-colour "{{ .blue }}"
setw -g clock-mode-colour "{{ .blue }}"
