# Catppuccin {{ .name }} for hyprlock, sourced by ~/.config/hypr/hyprlock.conf:
# $base, $blue, ... as rgb() colours, $panel_rim and $panel_fill, and $wallpaper for this mode.
# Generated by chezmoi from .chezmoitemplates/colors/hyprlock.conf.
{{ range $name, $value := . }}{{ if hasPrefix "#" $value }}${{ $name }} = rgb({{ trimPrefix "#" $value }})
{{ end }}{{ end -}}
# the glass card's faint text-coloured rim, and the boxes on it, tinted towards the text colour
# (the card's own tint is chosen by ~/.config/hypr/scripts/hyprlock_card.py)
$panel_rim = rgba({{ trimPrefix "#" .text }}1f)
$panel_fill = rgba({{ trimPrefix "#" .text }}26)
$wallpaper = {{ .wallpaper }}
