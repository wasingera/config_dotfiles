# Catppuccin {{ .name }} for hyprlock, sourced by ~/.config/hypr/hyprlock.conf:
# $base, $blue, ... as rgb() colours, $panel, $panel_rim and $panel_fill, and $wallpaper
# for this mode.
# Generated by chezmoi from .chezmoitemplates/colors/hyprlock.conf.
{{ range $name, $value := . }}{{ if hasPrefix "#" $value }}${{ $name }} = rgb({{ trimPrefix "#" $value }})
{{ end }}{{ end -}}
# the glass card behind the text: base at ~70% opacity over the blurred wallpaper, with a
# faint text-coloured rim, and boxes on it tinted towards the text colour
$panel = rgba({{ trimPrefix "#" .base }}b0)
$panel_rim = rgba({{ trimPrefix "#" .text }}1f)
$panel_fill = rgba({{ trimPrefix "#" .text }}26)
$wallpaper = {{ .wallpaper }}
